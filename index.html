<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daptrex | Suéteres, camisas y buzos</title>
  <meta name="description" content="Daptrex: suéteres, camisas y buzos.">
  <meta name="theme-color" content="#120a24">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1 class="sr-only">Daptrex</h1>
  <header class="top">
    <nav class="filters" aria-label="Filtrar prendas" id="filters"></nav>
  </header>

  <main class="page">
    <section class="grid" id="grid" aria-label="Catálogo"></section>
  </main>

  <dialog class="viewer" id="viewer" aria-label="Fotos de la prenda">
    <button class="viewer__close" id="viewer-close" aria-label="Cerrar">&times;</button>
    <div class="viewer__media"><img id="viewer-img" alt=""></div>
    <div class="viewer__thumbs" id="viewer-thumbs"></div>
    <p class="viewer__type" id="viewer-type"></p>
  </dialog>

  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
