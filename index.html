<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daptrex | Suéteres, camisas y buzos</title>
  <meta name="description" content="Daptrex: suéteres, camisas y buzos.">
  <meta name="theme-color" content="#120a24">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1 class="sr-only">Daptrex</h1>
  <header class="top">
    <nav class="filters" aria-label="Filtrar prendas" id="filters"></nav>
  </header>

  <main class="page" id="page">
    <section class="grid" id="grid" aria-label="Catálogo"></section>

    <section class="detail" id="detail" aria-label="Fotos de la prenda" hidden>
      <button class="detail__close" id="detail-close" type="button" aria-label="Volver al catálogo">&times;</button>
      <div class="detail__stage">
        <button class="arrow" id="detail-prev" type="button" aria-label="Foto anterior">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        </button>
        <div class="detail__frame" id="detail-frame"><img id="detail-img" alt=""></div>
        <button class="arrow" id="detail-next" type="button" aria-label="Foto siguiente">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        </button>
      </div>
      <div class="dots" id="detail-dots"></div>
      <p class="detail__type" id="detail-type"></p>
    </section>
  </main>

  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
