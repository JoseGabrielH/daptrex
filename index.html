<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daptrex | Suéteres, camisas y buzos</title>
  <meta name="description" content="Daptrex: suéteres, camisas y buzos.">
  <meta name="theme-color" content="#120a24">
  <link href="https://fonts.googleapis.com/css2?family=Sedgwick+Ave+Display&text=Daptrex&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1 class="sr-only">Daptrex</h1>
  <div class="marca" aria-hidden="true"><span>Daptrex</span></div>
  <div class="borde borde--izq" aria-hidden="true"></div>
  <div class="borde borde--der" aria-hidden="true"></div>
  <button class="bag" id="bag" type="button" aria-label="Ver bolsa de compra">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 10V6a3 3 0 0 1 6 0v4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span class="bag__count" id="bag-count" hidden></span>
  </button>
  <header class="top">
    <nav class="filters" aria-label="Filtrar prendas" id="filters"></nav>
  </header>

  <main class="page" id="page">
    <section class="grid" id="grid" aria-label="Catálogo"></section>

    <section class="detail" id="detail" aria-label="Fotos de la prenda" hidden>
      <button class="detail__close" id="detail-close" type="button" aria-label="Volver al catálogo">&times;</button>
      <div class="detail__stage">
        <button class="arrow" id="detail-prev" type="button" aria-label="Foto anterior">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        </button>
        <div class="detail__frame" id="detail-frame"><img id="detail-img" alt=""></div>
        <button class="arrow" id="detail-next" type="button" aria-label="Foto siguiente">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        </button>
      </div>
      <div class="dots" id="detail-dots"></div>
      <p class="detail__type" id="detail-type"></p>
      <p class="detail__price" id="detail-price"></p>
      <p class="detail__desc" id="detail-desc"></p>
      <div class="detail__actions" id="detail-actions">
        <a class="buy" id="detail-buy" target="_blank" rel="noopener">Comprar</a>
        <button class="add" id="detail-add" type="button" aria-label="Agregar a la bolsa">+</button>
      </div>
    </section>

    <section class="cart" id="cart" aria-label="Resumen de compra" hidden>
      <button class="detail__close" id="cart-close" type="button" aria-label="Cerrar la bolsa">&times;</button>
      <div class="cart__box">
        <h2 class="cart__title">Resumen de compra</h2>
        <p class="cart__empty" id="cart-empty">Tu bolsa está vacía</p>
        <div id="cart-items"></div>
        <div id="cart-footer">
          <p class="cart__total"><span>Total</span><span id="cart-total"></span></p>
          <a class="buy" id="cart-buy" target="_blank" rel="noopener">Comprar</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="pie" id="pie">
    <a href="https://www.facebook.com/estebandaniel.gonzalez.58/" target="_blank" rel="noopener">Facebook</a>
    <a href="https://www.instagram.com/esteban.d4nie1?obrf=cjQ2eG9qdmludGli" target="_blank" rel="noopener">Instagram</a>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
